name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  riscv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: riscv32imac-unknown-none-elf
      - run: cargo build -p device-auth-core -p device-auth-firmware --target riscv32imac-unknown-none-elf

  xtensa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: esp-rs/xtensa-toolchain@v1.6
        with:
          default: true
          buildtargets: esp32s3
          version: "1.98.1.0"
          ldproxy: false
      - run: cargo build -p device-auth-core -p device-auth-firmware --target xtensa-esp32s3-none-elf -Zbuild-std=core
